const T=32,W=800,H=450;
const L=[
{n:'Çöl',t:'Başlangıç',len:55,gap:1,spk:.1,en:.25,es:.6,spd:.8,vary:0,sky:['#ffe2a0','#f2a65a'],gr:'#d9a441',tp:'#f0c868',far:'#e0b070',ch:'#c9a96a'},

let PT=[],shk=0,B=[],boss=null,arenaX=0,cpX=0,cpY=0,cpHit=false,inGame=false,tr=[],D,tries=0,stomps=0,ft=0,shield=0,inv=0,P,E,S,C,flagX,lv=0,st='menu',p,cam,chx,coins,tick=0;
let bul=[],DR=[],ammo=0,fcd=0,mode='cls',tleft=0;

{ic:'🏜️',d:'Sıcak kum ve kaktüsler. Isınma turu.',st:1,pit:'#b8863a',deco:'cactus',stairs:.15},

{len:130,gap:3,en:.5,spk:.3,ek:['walk','hop','archer'],bn:'Orman Golemi',bh:60,bhp:4,bs:1.6,d:'Okçular çıkıyor! Boss: Orman Golemi.'},
{len:160,en:.6,spk:.4,spd:1.6,ek:['walk','archer','bat'],bn:'Buz Devi',bh:64,bhp:5,bs:1.9,d:'Buz kayar, yarasalar var. Boss: Buz Devi.'},
{len:190,en:.7,spk:.5,spd:1.9,ek:['hop','archer','bat'],bn:'Lav Ejderi',bh:72,bhp:6,bs:2.2,d:'Ateş topları, lav alevleri. Boss: Lav Ejderi.'},
{len:230,en:.8,spk:.6,spd:2.2,ek:['walk','hop','archer','bat','archer'],bn:'VIP Kral',bh:80,bhp:8,bs:2.5,d:'Hepsi bir arada. Boss: VIP Kral.'}];
L.forEach((l,i)=>Object.assign(l,Y[i]));
const Z=[
{n:'Bataklık',t:'Bataklık',ic:'🐊',d:'Çamurlu zemin, yoğun okçular.',st:4,len:260,gap:3,spk:.45,en:.65,es:1.5,spd:1.9,vary:1,sky:['#1d3b2a','#6b8f5a'],gr:'#3b2f1a',tp:'#5f8a3a',far:'#2b4a34',ch:'#3a5a2a',pit:'#4a6a2a',deco:'tree',stairs:.3,ek:['walk','hop','archer','archer'],bn:'Bataklık Devi',bh:76,bhp:7,bs:2.3,bc:['#7fa84a','#2f4a1a'],bl:'#8fd04a'},
{n:'Kristal Mağara',t:'Kristal',ic:'💎',d:'Kaygan kristal zemin, yarasa sürüsü.',st:4,len:280,gap:3,spk:.5,en:.7,es:1.7,spd:2.0,vary:1,sky:['#0a1a3a','#2a4a8a'],gr:'#1c2a4a',tp:'#5ee6ff',far:'#1a2a5a',ch:'#5ee6ff',pit:'#2a6aff',deco:'crystal',stairs:.35,ice:1,gem:1,ek:['hop','archer','bat','bat'],bn:'Kristal Golem',bh:80,bhp:8,bs:2.5,bc:['#8ff0ff','#1a6a9a'],bl:'#5ee6ff'},
{n:'Kızıl Kanyon',t:'Kanyon',ic:'🪨',d:'Geniş boşluklar, dikenli kayalar.',st:5,len:300,gap:4,spk:.55,en:.75,es:1.9,spd:2.2,vary:1,sky:['#ff9a5a','#ffd9a0'],gr:'#a0452a',tp:'#e0703a',far:'#c0603a',ch:'#8a2a1a',pit:'#7a2a10',deco:'rock',stairs:.35,ek:['walk','hop','archer','bat'],bn:'Kanyon Kartalı',bh:80,bhp:9,bs:2.7,bc:['#e0a050','#6a2a10'],bl:'#ff8a3a'},
{n:'Fırtına Zirvesi',t:'Fırtına',ic:'⛈️',d:'Buz, rüzgâr ve hızlı kovalamaca.',st:5,len:320,gap:4,spk:.6,en:.8,es:2.0,spd:2.4,vary:1,sky:['#1a2030','#5a6a8a'],gr:'#3a4050',tp:'#aab8d0',far:'#40485a',ch:'#c0d0ff',pit:'#4a6a9a',deco:'pine',stairs:.4,ice:1,ek:['hop','archer','bat','archer'],bn:'Fırtına Kralı',bh:84,bhp:10,bs:2.9,bc:['#c0d0ff','#3a4a8a'],bl:'#9fb8ff'},
{n:'Kaos Çekirdeği',t:'KAOS',ic:'☠️',d:'Efsanevi zorluk. Her şey aynı anda.',st:5,len:360,gap:4,spk:.65,en:.9,es:2.3,spd:2.7,vary:1,sky:['#000','#4a0a2a'],gr:'#1a0a14',tp:'#ff2a6a',far:'#2a0a1a',ch:'#ff2a6a',pit:'#ff0044',deco:'crystal',stairs:.4,gem:1,ek:['walk','hop','archer','bat','archer','hop'],bn:'Kaos Efendisi',bh:96,bhp:12,bs:3.2,bc:['#ff5a8a','#2a0a1a'],bl:'#ff2a6a'}];
/* denge: önceki sürüme göre biraz daha kolay */
Z.forEach(z=>{z.en*=.85;z.spk*=.8;z.es*=.9;z.spd*=.92;z.gap=Math.max(2,z.gap-1);z.bhp=Math.round(z.bhp*.8);L.push(z)});
L.forEach((l,i)=>{if(i<5){l.len=Math.round(l.len*1.25);l.en=Math.min(.85,l.en+.03);l.spk=Math.min(.6,l.spk+.02);l.spd*=.92}});
const U=[
{id:'jump',n:'Zıplama',ic:'🦘',max:3,cost:[40,90,160],d:'Daha yükseğe zıpla'},
{id:'speed',n:'Hız',ic:'👟',max:3,cost:[40,90,160],d:'Daha hızlı koş'},
{id:'magnet',n:'Mıknatıs',ic:'🧲',max:3,cost:[50,110,200],d:'Altınları çeker'},
{id:'shield',n:'Kalkan',ic:'🛡️',max:2,cost:[120,250],d:'Düşman/dikenden korur'},
{id:'djump',n:'Çift Zıplama',ic:'⏫',max:1,cost:[300],d:'Havada bir kez daha zıpla'},
{id:'mult',n:'Çarpan',ic:'💰',max:3,cost:[80,180,320],d:'Kazanç +%25 / seviye'},
{id:'ammo',n:'Mermi Kapasitesi',ic:'🎒',max:3,cost:[60,130,240],d:'Her kutu/silah +2 mermi verir'},
{id:'fire',n:'Ateş Hızı',ic:'⚡',max:3,cost:[70,150,260],d:'Silahı daha hızlı ateşle'},
{id:'start',n:'Başlangıç Mermisi',ic:'🔫',max:3,cost:[100,200,350],d:'Oyuna +4 mermiyle başla'}];
let sv={coins:0,u:{},best:[0,0,0,0,0],unl:1,own:{},rec:{},eq:{skin:'red',hat:'none',trail:'none',gun:'std'}};
try{sv={...sv,...JSON.parse(localStorage.getItem('kacis_s2')||'{}')}}catch(e){}
sv.eq={skin:'red',hat:'none',trail:'none',gun:'std',...sv.eq};sv.rec=sv.rec||{};
const save=()=>{try{localStorage.setItem('kacis_s2',JSON.stringify(sv))}catch(e){}};
const up=id=>sv.u[id]||0,mult=()=>(1+.25*up('mult'))*(1+.1*up('gold'));
let AC;function snd(f,d,t){if(sv.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain();o.type=t||'sine';o.frequency.value=f;v.gain.value=.05;o.connect(v);v.connect(AC.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const burst=(x,y,c,n)=>{for(let i=0;i<n;i++)PT.push({x,y,vx:(Math.random()-.5)*6,vy:-Math.random()*5,l:30,c})};

/* ===== MÜZİK MOTORU ===== */
const MUS=(()=>{
const MU={th:-1,step:0,next:0,boss:0,dk:0,g:null,d:null};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const TH=[
{bpm:104,root:50,sc:[0,1,4,5,7,8,10],pr:[0,0,5,4],lw:'sawtooth',bw:'triangle',arp:0,dr:1,sd:3},
{bpm:126,root:48,sc:[0,2,4,7,9],pr:[0,3,4,2],lw:'square',bw:'triangle',arp:1,dr:2,sd:7},
{bpm:112,root:57,sc:[0,2,4,6,7,9,11],pr:[0,2,4,3],lw:'triangle',bw:'sine',arp:1,dr:1,sd:11},
{bpm:148,root:52,sc:[0,2,3,5,7,8,11],pr:[0,0,5,6],lw:'sawtooth',bw:'sawtooth',arp:1,dr:2,sd:5},
{bpm:138,root:50,sc:[0,2,3,5,7,8,10],pr:[0,5,3,4],lw:'square',bw:'sawtooth',arp:1,dr:2,sd:13},
{bpm:92,root:54,sc:[0,1,3,5,7,8,10],pr:[0,0,3,1],lw:'triangle',bw:'sawtooth',arp:0,dr:1,sd:17},
{bpm:118,root:55,sc:[0,2,4,6,7,9,11],pr:[0,4,1,3],lw:'sine',bw:'triangle',arp:1,dr:1,sd:19},
{bpm:124,root:57,sc:[0,1,4,5,7,8,10],pr:[0,1,0,5],lw:'sawtooth',bw:'triangle',arp:1,dr:2,sd:23},
{bpm:150,root:48,sc:[0,2,3,5,7,8,10],pr:[0,5,2,6],lw:'square',bw:'sawtooth',arp:1,dr:2,sd:29},
{bpm:164,root:45,sc:[0,1,3,4,6,7,9],pr:[0,1,0,6],lw:'sawtooth',bw:'sawtooth',arp:1,dr:2,sd:31},
{bpm:96,root:55,sc:[0,2,4,7,9],pr:[0,3,4,3],lw:'triangle',bw:'sine',arp:1,dr:0,sd:37},{bpm:84,root:41,sc:[0,2,3,5,7,8,10],pr:[0,5,3,4],lw:'sawtooth',bw:'sawtooth',arp:1,dr:2,sd:41}];window.T11=1;
const dn=(t,d)=>{const n=t.sc.length;return t.root+t.sc[((d%n)+n)%n]+12*Math.floor(d/n)};
TH.forEach(t=>{const r=rng(t.sd*101);t.mel=[];
  for(let b=0;b<4;b++){if(b==2){t.mel.push(t.mel[0]);continue}
    const m=[],w=[0,0,2,4,-1,1,2,-2];
    for(let s=0;s<16;s++){if(s%2==0&&(s%4==0||r()<.55))m.push(b==3&&s==12?(r()<.5?0:2):w[Math.floor(r()*w.length)]);else m.push(null)}
    t.mel.push(m)}});
let nb=null;
const init=()=>{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(MU.g)return;
  MU.g=AC.createGain();MU.g.gain.value=sv.mute?0:.38;
  const d=AC.createDelay(),fb=AC.createGain(),wet=AC.createGain(),cmp=AC.createDynamicsCompressor();
  d.delayTime.value=.28;fb.gain.value=.3;wet.gain.value=.35;
  d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(MU.g);MU.d=d;
  MU.g.connect(cmp);cmp.connect(AC.destination);
  nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1};
const nt=(f,t,d,ty,v,dl)=>{const o=AC.createOscillator(),e=AC.createGain();o.type=ty;o.frequency.value=f;
  e.gain.setValueAtTime(.0001,t);e.gain.linearRampToValueAtTime(v,t+.012);e.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(e);e.connect(MU.g);if(dl)e.connect(MU.d);o.start(t);o.stop(t+d+.05)};
const kick=(t,v)=>{const o=AC.createOscillator(),e=AC.createGain();
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
  e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.001,t+.18);
  o.connect(e);e.connect(MU.g);o.start(t);o.stop(t+.2)};
const nz=(t,d,hp,v)=>{const s=AC.createBufferSource(),f=AC.createBiquadFilter(),e=AC.createGain();
  s.buffer=nb;f.type='highpass';f.frequency.value=hp;e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f);f.connect(e);e.connect(MU.g);s.start(t);s.stop(t+d+.02)};
const stp=(t,i,sp)=>{const th=TH[MU.th],s=i%16,b=(i>>4)%4,n=th.sc.length,deg=th.pr[b],dr=MU.boss?2:th.dr,ar=th.arp||MU.boss;
  if(s%2==0)nt(mtof(dn(th,deg)-12+(s%8==6||s==14?12:0)),t,sp*1.9,th.bw,.2);
  if(ar)nt(mtof(dn(th,deg+[0,2,4,2][s%4])),t,sp*1.4,'square',.04,1);
